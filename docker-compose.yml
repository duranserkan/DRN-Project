name: drn-app

x-sample-postgres-connection: &sample-postgres-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:-drn};Username=${POSTGRES_USER:?configure in the .env file};Password=${POSTGRES_PASSWORD:?configure in the .env file};Max Auto Prepare=10;Maximum Pool Size=20;Application Name=Sample.Hosted;"

services:
  sample:
    container_name: drn-sample
    image: ${DOCKER_REGISTRY-}sample:${APP_VERSION:-0.0.1}
    build:
      context: .
      dockerfile: Sample.Hosted/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      graylog:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      Kestrel__Endpoints__All__Url: http://+:5998
      Environment: ${Environment:-Staging}
      # Staging and production reject wildcard AllowedHosts; keep this explicit for host-filtering safety.
      AllowedHosts: "${AllowedHosts:-localhost;127.0.0.1;[::1];sample;drn-sample}"
      Identity__RequireConfirmedAccount: ${Identity__RequireConfirmedAccount:-false}
      Identity__RequireConfirmedEmail: ${Identity__RequireConfirmedEmail:-false}
      Identity__RequireConfirmedPhoneNumber: ${Identity__RequireConfirmedPhoneNumber:-false}
      DrnDevelopmentSettings__AutoMigrateStaging: ${DrnDevelopmentSettings__AutoMigrateStaging:-true}
      DrnAppFeatures__SeedKey: ${DrnAppFeatures__SeedKey:?configure a unique SeedKey matching the requirements in .sample-env}
      # This service runs as Staging, so NexusAppSettings__Keys__0__KeyMaterial is required.
      # DrnAppFeatures__SeedKey is not used to derive Nexus key material for this Staging service.
      # Alternative formats: set NexusAppSettings__Keys__0__Format to Hex, Base64, or Base64UrlEncoded; decoded bytes must be exactly 32.
      NexusAppSettings__Keys__0__KeyMaterial: ${NexusAppSettings__Keys__0__KeyMaterial:?generate a unique 32-byte Nexus key and configure its matching Format in the .env file}
      NexusAppSettings__Keys__0__Format: ${NexusAppSettings__Keys__0__Format:-Utf8}
      NexusAppSettings__Keys__0__Default: ${NexusAppSettings__Keys__0__Default:-true}
      ConnectionStrings__DrnDataProtectionContext: *sample-postgres-connection
      ConnectionStrings__QAContext: *sample-postgres-connection
      ConnectionStrings__QBContext: *sample-postgres-connection
      ConnectionStrings__SampleIdentityContext: *sample-postgres-connection
      NLog__targets__graylog-udp__address: ${NLOG_GRAYLOG_UDP_ADDRESS:-udp://graylog:12201}
      NLog__targets__graylog-http__address: ${NLOG_GRAYLOG_HTTP_ADDRESS:-http://graylog:12201/gelf}
      NLog__rules__0__writeTo: ${NLog__rules__0__writeTo:-console,graylog-udp}
    ports:
      - "127.0.0.1:5998:5998/tcp"
    networks:
      - default
      - graylog
    volumes:
      # Optional exported TLS certificates. Also configure the Kestrel HTTPS endpoint and certificate.
      # - ~/.aspnet/https:/https:ro # Linux and macOS
      # - ${USERPROFILE}/.aspnet/https:/https:ro # Windows
      - ~/.microsoft/usersecrets:/home/app/.microsoft/usersecrets #map secrets for linux & macos
      #- %APPDATA%\Microsoft\UserSecrets:/home/app/.microsoft/usersecrets  #map secrets for windows

  # https://hub.docker.com/_/postgres
  postgres:
    image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    container_name: drn-infra-postgres
    restart: unless-stopped
    volumes:
      - drn-postgres-data:/data/postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:? configure in the .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? configure in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-drn}
      # Keep the database inside the named volume mounted above.
      PGDATA: /data/postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # https://hub.docker.com/_/rabbitmq
  rabbit:
    image: rabbitmq:4.4.1-management-alpine@sha256:2b47b1aa05ec7e373950ad2e9200e9f95a9da7039c8d22c19dbf5a59101362c4
    container_name: drn-infra-rabbit
    hostname: ${RABBITMQ_HOSTNAME:?set a stable hostname for a new broker or preserve the existing hostname; see Docker/Rabbitmq/README.md}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?configure a non-guest username in the .env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?configure a generated password in the .env file}
      RABBITMQ_PID_FILE: /var/lib/rabbitmq/rabbitmq.pid
    # Requires Docker Compose 2.30+. Import only after bootstrap credentials exist.
    post_start:
      - command: ["rabbitmqctl", "wait", "/var/lib/rabbitmq/rabbitmq.pid", "--timeout", "120"]
        user: rabbitmq
      - command: ["rabbitmqctl", "import_definitions", "/etc/rabbitmq/definitions.json", "--timeout", "120"]
        user: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - drn-rabbit-log:/var/log/rabbitmq/
      - drn-rabbit-lib:/var/lib/rabbitmq/
      - ./Docker/Rabbitmq/Image/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./Docker/Rabbitmq/Image/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./Docker/Rabbitmq/Image/rabbitmq.conf:/etc/rabbitmq/conf.d/90-drn.conf:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # https://go2docs.graylog.org/current/downloading_and_installing_graylog/compatibility_matrix.htm
  # https://hub.docker.com/_/mongo/
  # Source codes under this folder is obtained/derived from https://github.com/Graylog2/docker-compose/blob/main/open-core/docker-compose.yml
  # and have same license restrictions with original source codes.
  mongodb:
    image: "mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3"
    restart: "on-failure"
    container_name: drn-infra-graylog-mongo
    networks:
      - graylog
    volumes:
      - graylog-mongodb_data:/data/db
      - graylog-mongodb_config:/data/configdb
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # For DataNode setup, graylog starts with a preflight UI, this is a change from just using OpenSearch/Elasticsearch.
  # Please take a look at the README at the top of this repo or the regular docs for more info.
  # Graylog Data Node: https://hub.docker.com/r/graylog/graylog-datanode
  datanode:
    image: "${DATANODE_IMAGE:-graylog/graylog-datanode:7.2.2@sha256:8aef39788a1ce22cb2c221ceaaedc65721ae41cab38464d7c17815f55943b7a6}"
    container_name: drn-infra-graylog-datanode
    hostname: "datanode"
    environment:
      # https://hub.docker.com/r/graylog/graylog-datanode#configuration
      # https://go2docs.graylog.org/current/setting_up_graylog/data_node_configuration_file.htm
      GRAYLOG_DATANODE_OPENSEARCH_HEAP: 2g
      GRAYLOG_DATANODE_NODE_ID_FILE: "/var/lib/graylog-datanode/node-id"
      # GRAYLOG_DATANODE_PASSWORD_SECRET and GRAYLOG_PASSWORD_SECRET MUST be the same value
      GRAYLOG_DATANODE_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET:?Please configure GRAYLOG_PASSWORD_SECRET in the .env file}"
      GRAYLOG_DATANODE_MONGODB_URI: "mongodb://mongodb:27017/graylog"
    ulimits:
      memlock:
        hard: -1
        soft: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:8999:8999/tcp"   # DataNode API
      - "127.0.0.1:9200:9200/tcp"
      - "127.0.0.1:9300:9300/tcp"
    networks:
      - graylog
    volumes:
      - graylog-datanode:/var/lib/graylog-datanode
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec ': > /dev/tcp/127.0.0.1/8999'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: "on-failure"

  # https://hub.docker.com/r/graylog/graylog/
  # For initial configuration password will be generated by system. Check console out put for it
  # Later on use password defined in your .env file
  # An example output is as below:
  #
  # It seems you are starting Graylog for the first time. To set up a fresh install, a setup interface has
  # drn-infra-graylog     | been started. You must log in to it to perform the initial configuration and continue.
  # drn-infra-graylog     |
  # drn-infra-graylog     | Initial configuration is accessible at 0.0.0.0:9000, with username 'admin' and password 'vwtxJbPxqM'.
  # drn-infra-graylog     | Try clicking on http://admin:vwtxJbPxqM@0.0.0.0:9000
  graylog:
    image: "${GRAYLOG_IMAGE:-graylog/graylog:7.2.2@sha256:ab6bff1cb38d3aeee5273d71af76a453fcd2884035d417c0b2012551818f21dc}"
    container_name: drn-infra-graylog
    hostname: "server"
    depends_on:
      mongodb:
        condition: "service_healthy"
      datanode:
        condition: "service_healthy"
    entrypoint: "/usr/bin/tini --  /docker-entrypoint.sh"
    environment:
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/data/node-id
      # GRAYLOG_DATANODE_PASSWORD_SECRET and GRAYLOG_PASSWORD_SECRET MUST be the same value
      GRAYLOG_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET:?Please configure GRAYLOG_PASSWORD_SECRET in the .env file}"
      GRAYLOG_ROOT_PASSWORD_SHA2: "${GRAYLOG_ROOT_PASSWORD_SHA2:?Please configure GRAYLOG_ROOT_PASSWORD_SHA2 in the .env file}"
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9000/
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
    ports:
      - "127.0.0.1:5044:5044/tcp"   # Beats
      - "127.0.0.1:5140:5140/udp"   # Syslog
      - "127.0.0.1:5140:5140/tcp"   # Syslog
      - "127.0.0.1:5555:5555/tcp"   # RAW TCP
      - "127.0.0.1:5555:5555/udp"   # RAW UDP
      - "127.0.0.1:9000:9000/tcp"   # Server API
      - "127.0.0.1:12201:12201/tcp" # GELF TCP
      - "127.0.0.1:12201:12201/udp" # GELF UDP
      #- "127.0.0.1:10000:10000/tcp" # Custom TCP port
      #- "127.0.0.1:10000:10000/udp" # Custom UDP port
      - "127.0.0.1:13301:13301/tcp" # Forwarder data
      - "127.0.0.1:13302:13302/tcp" # Forwarder config
    networks:
      - graylog
    volumes:
      - graylog_data:/usr/share/graylog/data/data
    restart: "on-failure"

networks:
  graylog:
    driver: "bridge"

volumes:
  drn-postgres-data:
  drn-rabbit-log:
  drn-rabbit-lib:
  graylog-mongodb_data:
  graylog-mongodb_config:
  graylog-datanode:
  graylog_data:
