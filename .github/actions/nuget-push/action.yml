name: Nuget Push
description: Pushes a single staged NuGet package and symbol package to a configured NuGet source using a pre-authenticated API key.
inputs:
  project-name:
    description: The project directory and csproj base name (e.g. DRN.Framework.Utils).
    required: true
  version:
    description: Package version extracted from the release tag.
    required: true
  package-source-url:
    description: NuGet package source URL used for package push.
    required: true
  nuget-api-key:
    description: Pre-authenticated short-lived API key from a parent NuGet login step.
    required: true
runs:
  using: "composite"
  steps:
    - name: Validate package version
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
          echo "Expected version to be semver-like, got: $PACKAGE_VERSION"
          exit 1
        fi

    - name: Push
      shell: bash
      working-directory: ${{ github.workspace }}/artifacts/packages
      env:
        # Assigned to an env var to avoid direct expression interpolation in the
        # shell script — prevents script injection (GitHub Actions security advisory).
        PROJECT_NAME: ${{ inputs.project-name }}
        PACKAGE_VERSION: ${{ inputs.version }}
        PACKAGE_SOURCE_URL: ${{ inputs.package-source-url }}
        NUGET_API_KEY: ${{ inputs.nuget-api-key }}
      run: |
        set -euo pipefail

        if [[ ! "$PACKAGE_SOURCE_URL" =~ ^https://[^[:space:]]+$ ]]; then
          echo "Expected package-source-url to be an HTTPS NuGet source URL, got: $PACKAGE_SOURCE_URL"
          exit 1
        fi

        if [[ -z "$NUGET_API_KEY" ]]; then
          echo "Expected nuget-api-key to be provided for package push, got empty string."
          exit 1
        fi

        PACKAGE_BASENAME="${PROJECT_NAME}.${PACKAGE_VERSION}"
        if [[ ! -f "${PACKAGE_BASENAME}.nupkg" || ! -f "${PACKAGE_BASENAME}.snupkg" ]]; then
          echo "Expected ${PACKAGE_BASENAME}.nupkg and ${PACKAGE_BASENAME}.snupkg in ${PWD}."
          exit 1
        fi

        # Publish the artifacts independently so a retry can repair a missing symbol package
        # when the primary package already exists at the source.
        # https://learn.microsoft.com/nuget/create-packages/symbol-packages-snupkg#publishing-a-symbol-package
        # https://learn.microsoft.com/dotnet/core/tools/dotnet-nuget-push#options
        dotnet nuget push "${PACKAGE_BASENAME}.nupkg" --no-symbols --skip-duplicate --api-key "$NUGET_API_KEY" --source "$PACKAGE_SOURCE_URL"
        dotnet nuget push "${PACKAGE_BASENAME}.snupkg" --skip-duplicate --api-key "$NUGET_API_KEY" --source "$PACKAGE_SOURCE_URL"
