name: Setup Sdk
description: "Set up .NET 10.0 and Temurin JDK 25 distributions."
inputs:
  working-directory:
    description: "Repository directory containing global.json."
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - name: Validate global.json policy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        [[ -f global.json ]] || { echo "global.json is required." >&2; exit 1; }
        jq -e '
          type == "object" and (keys | sort) == ["sdk"] and (.sdk | type == "object") and
          (.sdk | keys | sort) == ["allowPrerelease", "rollForward", "version"] and
          (.sdk.version | type == "string" and test("^10\\.0\\.(0|[1-9][0-9]*)$")) and
          (.sdk.rollForward == "latestFeature") and (.sdk.allowPrerelease == false)
        ' global.json >/dev/null || { echo "global.json violates the pinned SDK policy" >&2; exit 1; }

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: ${{ inputs.working-directory }}/global.json
    - name: Set up Temurin JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: 25
        distribution: 'temurin'
