name: Setup Sdk
description: "Set up .NET 10.0 and Java JDK 21 distributions."
inputs:
  working-directory:
    description: "Repository directory containing global.json."
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: ${{ inputs.working-directory }}/global.json
    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: 21
        distribution: 'temurin'
