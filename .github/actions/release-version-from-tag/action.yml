name: Release Version From Tag
description: "Validate the release tag shape and expose the package/image version."
outputs:
  version:
    description: "Release version extracted from the release tag."
    value: ${{ steps.version.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Set version from tag
      id: version
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        if [[ "$GITHUB_REF" != refs/tags/* ]]; then
          echo "Expected a tag ref, got: $GITHUB_REF"
          exit 1
        fi

        tag_pattern='^release/v([0-9]+\.[0-9]+\.[0-9]+(-preview[0-9]{3})?)$'
        if [[ ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
          echo "Invalid release tag: $GITHUB_REF_NAME"
          exit 1
        fi

        echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
