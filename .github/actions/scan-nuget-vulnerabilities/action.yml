name: Scan Vulnerabilities
description: "Scan NuGet packages for vulnerabilities."
inputs:
  working-directory:
    description: "Repository directory containing the solution file."
    required: false
    default: "."
  solution-file:
    description: "Solution file to scan for NuGet vulnerabilities."
    required: false
    default: DRN.slnx
runs:
  using: "composite"
  steps:
    - name: Scan vulnerabilities
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SOLUTION_FILE: ${{ inputs.solution-file }}
      run: |
        # Strict mode keeps CI honest: fail on unhandled errors, unset variables,
        # and failed pipeline commands instead of continuing with partial state.
        set -euo pipefail

        # dotnet list package does not support docker-compose.dcproj. Work on a
        # temporary solution copy so this scan never mutates the tracked solution.
        #
        # mktemp creates a unique placeholder path. The .slnx suffix is added to
        # the copy because dotnet sln/list should receive a solution-shaped file.
        temp_solution="$(mktemp ./DRN.package-scan.XXXXXX)"
        scan_solution="${temp_solution}.slnx"

        # Always remove both temp paths, even when restore/list commands fail.
        cleanup() {
          rm -f "$temp_solution" "$scan_solution"
        }
        trap cleanup EXIT

        cp "$SOLUTION_FILE" "$scan_solution"

        # Ignore removal failure so the scan remains tolerant if the project is
        # already absent from a future solution layout.
        dotnet sln "$scan_solution" remove docker-compose.dcproj || true

        # Reuse assets from the preceding trusted locked-mode restore. On .NET
        # 10, dotnet list restores implicitly unless --no-restore is specified,
        # which would allow repository-controlled NuGet configuration back into
        # the dependency resolution path.
        #
        # Capture output and exit code manually. With set -e, an unhandled
        # non-zero command would exit before we can print dotnet's diagnostics.
        status=0
        package_report=$(dotnet list "$scan_solution" package --no-restore --include-transitive --vulnerable --format json --output-version 1) || status=$?
        if [ "$status" -ne 0 ]; then
          echo "$package_report"
          exit "$status"
        fi

        # Treat absent, malformed, or structurally unexpected output as a scan
        # failure. Version 1 keeps the small contract below stable across SDKs.
        if [[ -z "${package_report//[[:space:]]/}" ]]; then
          echo "NuGet vulnerability scan returned an empty report." >&2
          exit 1
        fi

        if ! jq -e '
          type == "object" and
          .version == 1 and
          (.projects | type == "array" and length > 0) and
          all(.projects[]; (.frameworks | type == "array"))
        ' <<< "$package_report" >/dev/null; then
          echo "NuGet vulnerability scan returned malformed or unexpected JSON." >&2
          echo "$package_report"
          exit 1
        fi

        # The CLI succeeds even when it reports vulnerabilities. Capture the
        # count so a jq error cannot be mistaken for a clean report.
        if ! vulnerability_count=$(jq -er '
          [
            .projects[].frameworks[]
            | ((.topLevelPackages // []) + (.transitivePackages // []))[]
            | (.vulnerabilities // [])[]
          ]
          | length
        ' <<< "$package_report"); then
          echo "NuGet vulnerability scan report could not be evaluated." >&2
          echo "$package_report"
          exit 1
        fi

        if [ "$vulnerability_count" -gt 0 ]; then
          echo "$package_report"
          exit 1
        fi
