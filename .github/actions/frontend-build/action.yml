name: Frontend Build
description: "Install and audit frontend dependencies, optionally testing and building Vite assets."
inputs:
  repository-directory:
    description: "Repository checkout containing all npm policy files and projects."
    required: false
    default: "."
  working-directory:
    description: "Directory containing the frontend package.json and package-lock.json."
    required: false
    default: Sample.Hosted
  build-assets:
    description: "Run unit tests and build Vite assets after dependency installation and audit. Set to false for analysis-only setup."
    required: false
    default: "true"
  browser-tests:
    description: "Run the focused Chromium suite when building assets."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # This nested action resolves from the trusted composite-action checkout in
    # split-checkout PR workflows while inspecting the PR-controlled repository.
    - name: Enforce npm dependency policy
      uses: ./.github/actions/npm-dependency-policy
      with:
        working-directory: ${{ inputs.repository-directory }}

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.22.1'
        package-manager-cache: false
    - name: Install npm dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Keep dependency restore deterministic and prevent dependency lifecycle
      # hooks from executing in CI. The explicit build step below runs the
      # project-owned scripts after audit.
      run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
    - name: Verify npm registry signatures and available provenance
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm audit signatures --registry=https://registry.npmjs.org/
    - name: Audit npm dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm audit --audit-level=high --registry=https://registry.npmjs.org/
    - name: Test frontend units
      if: ${{ inputs.build-assets != 'false' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm test
    - name: Install Chromium headless shell
      if: ${{ inputs.build-assets != 'false' && inputs.browser-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm exec --no -- playwright install --with-deps --only-shell chromium
    - name: Test frontend browser behavior
      if: ${{ inputs.build-assets != 'false' && inputs.browser-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run test:browser
    - name: Build Vite assets
      if: ${{ inputs.build-assets != 'false' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run build
