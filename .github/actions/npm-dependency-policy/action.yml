# PR workflows must execute this action only from the trusted base checkout.
name: npm Dependency Policy
description: "Validate approved npm configuration, exact versions, and lockfile metadata."
inputs:
  working-directory:
    description: "Repository checkout containing npm policy files and projects."
    required: true
runs:
  using: composite
  steps:
    - name: Validate npm dependency policy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        fail() {
          echo "npm dependency policy violation: $1" >&2
          exit 1
        }

        validate_npm_manifest() {
          local manifest="$1"

          jq -e '
            [(.dependencies // {}), (.devDependencies // {}), (.optionalDependencies // {}), (.peerDependencies // {})]
            | add | all(.[]; type == "string" and
                test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"))
          ' "$manifest" >/dev/null || fail "$manifest must use exact dependency versions"
        }

        validate_npm_lock() {
          local lockfile="$1"

          # The checks below depend on the npm lockfileVersion 3 schema.
          jq -e '
            .lockfileVersion == 3 and (.packages | type == "object") and
            (.packages[""] | type == "object") and
            all(.packages | to_entries[];
              (.key == "") or (.value.link == true) or (.value.inBundle == true) or
              (
                (.value.version | type == "string") and
                (.value.integrity | type == "string" and test("^sha512-[A-Za-z0-9+/]+={0,2}$")) and
                ((.value.resolved? == null) or
                 (.value.resolved | type == "string" and startswith("https://registry.npmjs.org/")))
              ))
          ' "$lockfile" >/dev/null || fail "$lockfile violates the npm lock policy"
        }

        validate_npmrc() {
          local npmrc="$1"
          local expected content
          expected=$'ignore-scripts=true\nengine-strict=true\nsave-exact=true\nregistry=https://registry.npmjs.org/'
          content="$(sed $'s/\r$//' "$npmrc")"
          [[ "$content" == "$expected" ]] ||
            fail "$npmrc must contain only the approved npm policy settings"
        }

        # Validate every policy file, including standalone .npmrc files that do
        # not currently have a sibling package.json.
        while IFS= read -r -d '' npmrc; do
          validate_npmrc "$npmrc"
        done < <(find . -path '*/node_modules' -prune -o -path '*/bin' -prune -o -path '*/obj' -prune -o -path '*/.git' -prune -o -name .npmrc -print0)

        # Each npm project must opt into the approved policy and provide a
        # deterministic lockfile before its dependencies are inspected.
        while IFS= read -r -d '' manifest; do
          npmrc="$(dirname "$manifest")/.npmrc"
          lockfile="$(dirname "$manifest")/package-lock.json"
          [[ -f "$npmrc" ]] || fail "$manifest has no sibling .npmrc"
          [[ -f "$lockfile" ]] || fail "$manifest has no sibling package-lock.json"
          validate_npm_manifest "$manifest"
          validate_npm_lock "$lockfile"
        done < <(find . -path '*/node_modules' -prune -o -path '*/bin' -prune -o -path '*/obj' -prune -o -path '*/.git' -prune -o -name package.json -print0)
