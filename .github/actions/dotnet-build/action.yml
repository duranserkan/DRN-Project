name: Dotnet Build
description: "Restore dependencies, scan NuGet vulnerabilities, and build solution in Release configuration."
inputs:
  working-directory:
    description: "Repository directory containing the solution file."
    required: false
    default: "."
  solution-file:
    description: "Solution file to restore, scan, and build."
    required: true
  version:
    description: "Optional package/application version to pass to MSBuild."
    required: false
    default: ""
  sonarqube-targets-imported:
    description: "Set SonarQubeTargetsImported=true for builds that must not load a stale Sonar MSBuild hook."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # This nested action resolves from the trusted composite-action checkout in
    # split-checkout PR workflows. Landing it here makes policy enforcement
    # self-activating after the action first reaches each protected base branch.
    - name: Enforce dependency policy
      uses: ./.github/actions/dependency-policy
      with:
        working-directory: ${{ inputs.working-directory }}
        base-sha: ${{ github.event.pull_request.base.sha }}
        head-sha: ${{ github.event.pull_request.head.sha }}

    - name: Reject repository-controlled NuGet restore overrides
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if git grep -n -i -E \
          'RestoreSources|RestoreAdditionalProjectSources|RestoreFallbackFolders|RestoreAdditionalProjectFallbackFolders|RestorePackagesPath|RestoreConfigFile|TreatAsLocalProperty' \
          -- . ':(exclude).github/actions/dotnet-build/action.yml'; then
          echo 'Repository-controlled NuGet restore overrides are not allowed.' >&2
          exit 1
        fi

    - name: Restore dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SOLUTION_FILE: ${{ inputs.solution-file }}
      # This composite action comes from the trusted checkout in PR workflows;
      # do not take package sources from PR-controlled configuration.
      run: |
        dotnet restore "$SOLUTION_FILE" \
          --locked-mode \
          -p:Configuration=Release \
          --configfile "$GITHUB_ACTION_PATH/NuGet.Config" \
          --packages "$RUNNER_TEMP/drn-nuget-packages" \
          -p:RestoreAdditionalProjectSources= \
          -p:RestoreFallbackFolders= \
          -p:RestoreAdditionalProjectFallbackFolders=
    - name: Scan vulnerabilities
      uses: ./.github/actions/scan-nuget-vulnerabilities
      with:
        working-directory: ${{ inputs.working-directory }}
        solution-file: ${{ inputs.solution-file }}
    - name: Build solution
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SOLUTION_FILE: ${{ inputs.solution-file }}
        BUILD_VERSION: ${{ inputs.version }}
        SONARQUBE_TARGETS_IMPORTED: ${{ inputs.sonarqube-targets-imported }}
      run: |
        set -euo pipefail

        build_args=(
          dotnet build "$SOLUTION_FILE"
          --no-restore
          --no-incremental
          --configuration Release
          -p:ContinuousIntegrationBuild=true
        )

        # Only release workflows pass a version. Avoid sending an empty
        # -p:Version value during PR/branch CI, and keep each argument quoted
        # separately instead of building one shell-interpreted command string.
        if [ -n "$BUILD_VERSION" ]; then
          build_args+=(-p:Version="$BUILD_VERSION")
        fi

        if [ "$SONARQUBE_TARGETS_IMPORTED" = "true" ]; then
          build_args+=(-p:SonarQubeTargetsImported=true)
        fi

        "${build_args[@]}"
