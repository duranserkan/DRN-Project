name: CodeQL Scan
description: "Set up CodeQL, build the repository, and upload SARIF results."
inputs:
  working-directory:
    description: "Repository directory containing the solution file."
    required: false
    default: "."
  solution-file:
    description: "Solution file to build for CodeQL tracing."
    required: true
  source-root:
    description: "Repository source root passed to CodeQL init."
    required: true
  checkout-path:
    description: "Absolute checkout path passed to CodeQL analyze."
    required: true
  languages:
    description: "Comma-separated CodeQL languages."
    required: false
    default: "csharp,javascript"
  version:
    description: "Optional package/application version to pass to MSBuild."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup SDK
      uses: ./.github/actions/setup-sdk-and-tools
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      env:
        CODEQL_OVERLAY_DATABASE_MODE: "none"
      with:
        languages: ${{ inputs.languages }}
        source-root: ${{ inputs.source-root }}

    - name: Build for CodeQL
      uses: ./.github/actions/dotnet-build
      with:
        working-directory: ${{ inputs.working-directory }}
        solution-file: ${{ inputs.solution-file }}
        version: ${{ inputs.version }}
        sonarqube-targets-imported: "true"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        output: sarif-results
        checkout_path: ${{ inputs.checkout-path }}
