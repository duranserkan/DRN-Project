name: Dotnet Sonar Scan
description: "Set up .NET, run SonarCloud analysis, build, and collect test coverage."
inputs:
  working-directory:
    description: "Repository directory containing the solution file."
    required: false
    default: "."
  sonar-scanner-version:
    description: "Pinned dotnet-sonarscanner version."
    required: false
    default: "11.2.1"
  dotnet-coverage-version:
    description: "Pinned dotnet-coverage version."
    required: false
    default: "18.9.0"
  solution-file:
    description: "Solution file to build during SonarCloud analysis."
    required: true
  version:
    description: "Optional package/application version to pass to SonarCloud analysis and MSBuild."
    required: false
    default: ""
  sonar-token:
    description: "SonarCloud token."
    required: true
  sonar-project-key:
    description: "SonarCloud project key."
    required: false
    default: "duranserkan_DRN-Project"
  sonar-host-url:
    description: "SonarCloud host URL."
    required: false
    default: "https://sonarcloud.io"
  sonar-organization:
    description: "SonarCloud organization."
    required: false
    default: "duranserkan"
  sonar-exclusions:
    description: "Source-analysis exclusions; defaults to generated wwwroot output to avoid scanning built assets as source."
    required: false
    default: "**/wwwroot/**"
  sonar-secrets-excluded-file-suffixes:
    description: "Binary suffixes excluded from Secrets decoding so valid image and font assets are not parsed as UTF-8 text."
    required: false
    default: ".jpeg,.jpg,.png,.gif,.ico,.bmp,.webp,.tiff,.woff,.woff2,.ttf,.eot,.otf"
  sonar-branch-name:
    description: "Optional SonarCloud branch name to attach analysis to when the workflow runs from a tag ref."
    required: false
    default: ""
  sonar-branch-target:
    description: "Optional SonarCloud target branch for non-main branch analysis."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup SDK
      uses: ./.github/actions/setup-sdk-and-tools
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Sonar Scan Begin
      uses: ./.github/actions/sonar-begin
      with:
        working-directory: ${{ inputs.working-directory }}
        sonar-scanner-version: ${{ inputs.sonar-scanner-version }}
        dotnet-coverage-version: ${{ inputs.dotnet-coverage-version }}
        sonar-token: ${{ inputs.sonar-token }}
        sonar-project-key: ${{ inputs.sonar-project-key }}
        sonar-host-url: ${{ inputs.sonar-host-url }}
        sonar-organization: ${{ inputs.sonar-organization }}
        sonar-exclusions: ${{ inputs.sonar-exclusions }}
        sonar-secrets-excluded-file-suffixes: ${{ inputs.sonar-secrets-excluded-file-suffixes }}
        version: ${{ inputs.version }}
        sonar-branch-name: ${{ inputs.sonar-branch-name }}
        sonar-branch-target: ${{ inputs.sonar-branch-target }}

    - name: Build
      uses: ./.github/actions/dotnet-build
      with:
        working-directory: ${{ inputs.working-directory }}
        solution-file: ${{ inputs.solution-file }}
        version: ${{ inputs.version }}

    - name: Test with Coverage
      uses: ./.github/actions/dotnet-test-coverage
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Sonar Scan End
      uses: ./.github/actions/sonar-end
      with:
        working-directory: ${{ inputs.working-directory }}
        sonar-token: ${{ inputs.sonar-token }}
