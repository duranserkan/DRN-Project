name: Sonar Begin
description: "Initialize SonarCloud scanning session."
inputs:
  working-directory:
    description: "Repository directory to analyze."
    required: false
    default: "."
  sonar-token:
    description: "SonarCloud token."
    required: true
  sonar-project-key:
    description: "SonarCloud project key."
    required: false
    default: "duranserkan_DRN-Project"
  sonar-host-url:
    description: "SonarCloud host URL."
    required: false
    default: "https://sonarcloud.io"
  sonar-organization:
    description: "SonarCloud organization."
    required: false
    default: "duranserkan"
  sonar-exclusions:
    description: "Source-analysis exclusions; defaults to generated wwwroot, bin, and obj output to avoid scanning build artifacts as source."
    required: false
    default: "**/wwwroot/**,**/bin/**,**/obj/**"
  frontend-lcov:
    description: "Optional comma-separated frontend LCOV file paths relative to the analysis directory."
    required: false
  sonar-typescript-tsconfig-paths:
    description: "Comma-separated TSConfig paths or patterns relative to working-directory. Empty uses Sonar discovery."
    required: false
    default: ""
  sonar-secrets-excluded-file-suffixes:
    description: "Binary suffixes excluded from Secrets decoding so valid image and font assets are not parsed as UTF-8 text."
    required: false
    default: ".jpeg,.jpg,.png,.gif,.ico,.bmp,.webp,.tiff,.woff,.woff2,.ttf,.eot,.otf"
  version:
    description: "Optional project version to attach to the SonarCloud analysis."
    required: false
    default: ""
  sonar-branch-name:
    description: "Optional SonarCloud branch name to attach analysis to when the workflow runs from a tag ref."
    required: false
    default: ""
  sonar-branch-target:
    description: "Optional SonarCloud target branch for non-main branch analysis."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Sonar tools
      uses: $/.github/actions/sonar-tools
      with:
        working-directory: ${{ inputs.working-directory }}
    - name: Sonar Scan Begin # Sonar Begin
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
        SONAR_EXCLUSIONS: ${{ inputs.sonar-exclusions }}
        FRONTEND_LCOV: ${{ inputs.frontend-lcov }}
        SONAR_TYPESCRIPT_TSCONFIG_PATHS: ${{ inputs.sonar-typescript-tsconfig-paths }}
        SONAR_SECRETS_EXCLUDED_FILE_SUFFIXES: ${{ inputs.sonar-secrets-excluded-file-suffixes }}
        SONAR_PROJECT_VERSION: ${{ inputs.version }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_BRANCH_NAME: ${{ inputs.sonar-branch-name }}
        SONAR_BRANCH_TARGET: ${{ inputs.sonar-branch-target }}
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true

        $scannerArgs = @(
          "begin",
          "/k:$env:SONAR_PROJECT_KEY",
          "/o:$env:SONAR_ORGANIZATION",
          "/d:sonar.token=$env:SONAR_TOKEN",
          "/d:sonar.cs.vscoveragexml.reportsPaths=coverage-unit.xml,coverage-analyzer.xml,coverage-integration.xml",
          "/d:sonar.jasmin.modules.all=true",
          "/d:sonar.host.url=$env:SONAR_HOST_URL",
          "/d:sonar.scanner.skipJreProvisioning=true",
          "/d:sonar.sourceEncoding=UTF-8",
          "/d:sonar.issue.ignore.multicriteria=e1",
          "/d:sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431",
          "/d:sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile*",
          "/d:sonar.qualitygate.wait=true",
          "/d:sonar.qualitygate.timeout=600"
        )

        if ($env:FRONTEND_LCOV) {
          $reports = $env:FRONTEND_LCOV.Split(',', [StringSplitOptions]::TrimEntries)
          # The JS/TS sensor resolves relative report paths from each .NET module.
          $resolvedReports = foreach ($report in $reports) {
            if (!$report) { throw "Empty path in frontend-lcov" }
            if (!(Select-String -LiteralPath $report -Pattern '^DA:[1-9][0-9]*,[0-9]+(,.*)?$' -Quiet)) {
              throw "Expected frontend line coverage in $report"
            }
            (Resolve-Path -LiteralPath $report).ProviderPath
          }
          $scannerArgs += "/d:sonar.javascript.lcov.reportPaths=$($resolvedReports -join ',')"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SONAR_EXCLUSIONS)) {
          $scannerArgs += "/d:sonar.exclusions=$env:SONAR_EXCLUSIONS"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SONAR_TYPESCRIPT_TSCONFIG_PATHS)) {
          $scannerArgs += "/d:sonar.typescript.tsconfigPaths=$env:SONAR_TYPESCRIPT_TSCONFIG_PATHS"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SONAR_SECRETS_EXCLUDED_FILE_SUFFIXES)) {
          $scannerArgs += "/d:sonar.secrets.excluded.file.suffixes=$env:SONAR_SECRETS_EXCLUDED_FILE_SUFFIXES"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SONAR_PROJECT_VERSION)) {
          $scannerArgs += "/v:$env:SONAR_PROJECT_VERSION"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SONAR_BRANCH_NAME)) {
          $scannerArgs += "/d:sonar.branch.name=$env:SONAR_BRANCH_NAME"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SONAR_BRANCH_TARGET)) {
          $scannerArgs += "/d:sonar.branch.target=$env:SONAR_BRANCH_TARGET"
        }

        dotnet tool run dotnet-sonarscanner @scannerArgs
