name: Sonar Tools
description: "Restore manifest-pinned SonarCloud scanner and dotnet-coverage tools."
inputs:
  working-directory:
    description: "Repository directory containing .config/dotnet-tools.json."
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - name: Restore Sonar tools
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Use the canonical config from the trusted workspace checkout.
        dotnet tool restore --configfile "$env:GITHUB_WORKSPACE/NuGet.Config"
