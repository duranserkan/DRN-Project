name: Frontend Validation
description: "Install and audit frontend dependencies, optionally testing and building Vite assets."
inputs:
  repository-directory:
    description: "Repository checkout containing all npm policy files and projects."
    required: false
    default: "."
  working-directory:
    description: "Directory containing the frontend package.json and package-lock.json."
    required: true
  build-assets:
    description: "Run frontend validation and build Vite assets after dependency installation and audit."
    required: false
    default: "true"
  unit-tests-only:
    description: "Run unit validation without rebuilding the frontend assets."
    required: false
    default: "false"
  coverage-report:
    description: "Optional .info or .lcov report path inside the frontend package."
    required: false
runs:
  using: "composite"
  steps:
    - name: Require frontend working directory
      shell: bash
      env:
        FRONTEND_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        if [[ -z "$FRONTEND_DIRECTORY" ]]; then
          echo "::error::frontend-validation requires working-directory"
          exit 1
        fi
    # This nested action resolves from the trusted composite-action checkout in
    # split-checkout PR workflows while inspecting the PR-controlled repository.
    - name: Enforce npm dependency policy
      uses: ./.github/actions/npm-dependency-policy
      with:
        working-directory: ${{ inputs.repository-directory }}

    # Keep the policy active for nested npm commands and later browser steps.
    - name: Configure npm for this job
      shell: bash
      run: |
        {
          echo 'NPM_CONFIG_IGNORE_SCRIPTS=true'
          echo 'NPM_CONFIG_ENGINE_STRICT=true'
          echo 'NPM_CONFIG_SAVE_EXACT=true'
          echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/'
        } >> "$GITHUB_ENV"

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # Read the trusted checkout's pin in split-checkout PR jobs.
        node-version-file: .node-version
        package-manager-cache: false
    - name: Install npm dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Keep dependency restore deterministic and prevent dependency lifecycle
      # hooks from executing in CI. The explicit build step below runs the
      # project-owned scripts after audit.
      run: npm ci --ignore-scripts --engine-strict --registry=https://registry.npmjs.org/
    - name: Verify npm registry signatures and available provenance
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm audit signatures --registry=https://registry.npmjs.org/
    - name: Audit npm dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm audit --audit-level=high --registry=https://registry.npmjs.org/
    - name: Build Vite assets
      if: ${{ inputs.build-assets != 'false' && inputs.unit-tests-only != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run build
    - name: Run frontend unit tests
      if: ${{ inputs.build-assets != 'false' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT: ${{ inputs.coverage-report }}
        FRONTEND_ACTION_SUMMARIZES_COVERAGE: ${{ inputs.coverage-report != '' && 'true' || 'false' }}
      run: |
        if [[ -z "$REPORT" ]]; then
          npm test
        else
          npm test -- --coverage --report "$REPORT"
          # Node emits package-relative source paths. Sonar scans the repository root.
          report_path="$(realpath -e -- "$REPORT")"
          [[ "$report_path" == "$(pwd -P)/"* && -f "$report_path" && ! -L "$REPORT" ]]
          temporary="$(mktemp -- "${report_path}.XXXXXX")"
          trap 'rm -f -- "$temporary"' EXIT
          awk -v prefix="$(git rev-parse --show-prefix)" '/^SF:/ { $0 = "SF:" prefix substr($0, 4) } { print }' "$report_path" > "$temporary"
          mv -T -- "$temporary" "$report_path"
        fi
    - name: Summarize frontend line coverage
      if: ${{ inputs.build-assets != 'false' && inputs.coverage-report != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT: ${{ inputs.coverage-report }}
      run: node "$GITHUB_ACTION_PATH/coverage.mts" "$REPORT" >> "$GITHUB_STEP_SUMMARY"
