# Protected-branch and scheduled CI for master. Token-bearing analysis stays
# here, away from pull request jobs that execute PR-controlled code.
name: master

on:
  push:
    branches: [ "master" ]
  schedule:
      - cron: '29 13 * * 0' # Every Sunday at 13:29 UTC

concurrency:
  group: master-ci
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  frontend-assets:
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-browser-bundle.yml

  playwright:
    needs: frontend-assets
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-browser-tests.yml
    with:
      artifact-id: ${{ needs.frontend-assets.outputs.artifact-id }}

  sonar:
    needs: frontend-assets
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set aside checked-in assets
        run: mv Sample.Hosted/wwwroot "$RUNNER_TEMP/checkout-wwwroot"
      - name: Download built frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.frontend-assets.outputs.artifact-id }}
          merge-multiple: true
          path: Sample.Hosted/wwwroot
      - name: Collect frontend unit coverage
        uses: $/.github/actions/frontend-validation
        with:
          working-directory: Sample.Hosted
          unit-tests-only: "true"
          coverage-report: coverage-frontend.info
      - name: Analyze frontend and backend coverage
        uses: $/.github/actions/dotnet-sonar-scan
        with:
          solution-file: DRN.slnx
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-typescript-tsconfig-paths: Sample.Hosted/tsconfig.json
          frontend-lcov: Sample.Hosted/coverage-frontend.info

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      SOLUTION_FILE: DRN.slnx
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run CodeQL scan
        uses: $/.github/actions/codeql-scan
        with:
          solution-file: ${{ env.SOLUTION_FILE }}
          source-root: .
          checkout-path: ${{ github.workspace }}

      # GitHub code scanning merge protection replaces the custom SARIF verifier.
      # Usage: protect the source branch in Settings -> Rules -> Rulesets,
      # enable "Require code scanning results", add CodeQL, then choose thresholds.
      # https://docs.github.com/en/code-security/how-tos/find-and-fix-code-vulnerabilities/manage-your-configuration/set-merge-protection

  gatekeeper:
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: ${{ always() }}
    # Keep this aggregate gate in sync with every required validation job.
    # Add new jobs to both `needs` and the result check below.
    needs:
      - playwright
      - sonar
      - codeql
    steps:
      - name: Verify required jobs completed successfully
        env:
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          if [ "$PLAYWRIGHT_RESULT" != "success" ] || [ "$SONAR_RESULT" != "success" ] || [ "$CODEQL_RESULT" != "success" ]; then
            echo "One or more required checks failed."
            echo "playwright: $PLAYWRIGHT_RESULT"
            echo "sonar: $SONAR_RESULT"
            echo "codeql: $CODEQL_RESULT"
            exit 1
          fi
          echo "Required jobs passed successfully."
