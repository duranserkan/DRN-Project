# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# Fast protected-branch CI for develop.
name: develop

on:
  push:
    branches: ["develop"]

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  frontend-assets:
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-browser-bundle.yml

  playwright:
    needs: frontend-assets
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-browser-tests.yml
    with:
      artifact-id: ${{ needs.frontend-assets.outputs.artifact-id }}

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect frontend unit coverage
        uses: $/.github/actions/frontend-validation
        with:
          working-directory: Sample.Hosted
          unit-tests-only: "true"
          coverage-report: coverage-frontend.info

  backend:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      SOLUTION_FILE: DRN.slnx
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run backend validation
        uses: $/.github/actions/dotnet-validate
        with:
          solution-file: ${{ env.SOLUTION_FILE }}

  gatekeeper:
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: ${{ always() }}
    # Keep this aggregate gate in sync with every required validation job.
    # Add new jobs to both `needs` and the result check below.
    needs:
      - playwright
      - frontend
      - backend
    steps:
      - name: Verify required jobs completed successfully
        env:
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          if [ "$PLAYWRIGHT_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ] || [ "$BACKEND_RESULT" != "success" ]; then
            echo "One or more required checks failed."
            echo "playwright: $PLAYWRIGHT_RESULT"
            echo "frontend: $FRONTEND_RESULT"
            echo "backend: $BACKEND_RESULT"
            exit 1
          fi
          echo "Required jobs passed successfully."
